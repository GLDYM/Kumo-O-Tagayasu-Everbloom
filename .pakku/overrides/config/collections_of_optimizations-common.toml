#Enable all Collections of Optimizations patches.
masterEnabled = true

#Xaero's Minimap patches.
[xaerominimap]
	#Maximum number of Minimap FBO renders per second. Set to 0 to disable the cap.
	# Default: 30
	# Range: 0 ~ 240
	renderFpsCap = 30

#Xaero's World Map patches.
[xaeroworldmap]
	#Milliseconds between free-VRAM queries. Set to 0 to query every frame as stock does.
	# Default: 500
	# Range: 0 ~ 60000
	vramPollInterval = 500

#Lootr patches.
[lootr]
	#Skip Lootr's per-level conversion pass while both queues are empty.
	skipIdleBlockEntityTicker = true
	#Maximum Lootr block-entity conversion candidates to process per server tick. Set to 0 for no limit.
	# Default: 512
	# Range: 0 ~ 65536
	blockEntityTickerBudget = 512

#Patchouli patches.
[patchouli]
	#Cache Patchouli's lookup from an item to its guide book.
	cacheBookItemLookup = true

#FTB Chunks patches.
[ftbchunks]
	#Skip rebuilding the minimap texture when the minimap is not visible.
	skipHiddenMinimapWork = false
	#Write map-region image pixels directly instead of calling BufferedImage.setRGB per pixel.
	fastRegionWrite = true

#Curios patches.
[curios]
	#Skip Curios ticking for entities that have no Curios slots.
	skipSlotlessEntities = true
	#Skip Curios client ticking for non-player entities.
	skipClientTickOnNonPlayers = true
	#Cache whether an entity type has Curios slots.
	cacheEntitySlotLookup = true
	#Avoid scanning Curios slots when an entity cannot contain the requested item.
	fastEquippedItemMiss = true
	#Avoid scanning Curios slots for findFirstCurio when the requested item is absent.
	fastFindFirstMiss = true

#TerraBlender patches.
[terrablender]
	#Cache TerraBlender's namespace rule lookup for the current biome.
	cacheNamespaceRule = true

#Zeta patches.
[zeta]
	#Reuse a snapshot of Zeta structure replacement functions.
	leanStructureReplacement = true
	#Reuse a Zeta event wrapper while dispatching the same Forge event.
	shareEventWrappers = true

#AmbientSounds patches.
[ambientsounds]
	#Memoize repeated biome condition checks on the client thread.
	memoBiomeMatch = true

#Balm patches.
[balm]
	#Cache BlockState string keys used by Balm dynamic model lookup.
	memoDynamicModelKeys = true

#Caelus patches.
[caelus]
	#Skip Caelus flight checks for grounded non-player entities.
	skipGroundedNonPlayers = true
