#Note: Starting from Minecraft 1.20.5, the game uses the component system instead of the NBT system.
#The configuration option called nbtMode only retains the naming from version 1.20.1.
#When enabled, allow to use item's component as settings. Component settings will override global settings.
#You can give item following components:
#create_blueprint_tweaks:can_survival_print=true/false
#create_blueprint_tweaks:survival_print_consume=true/false
#For example, if you want blueprints created by players through the blueprint table to not be printed directly,
#and only the blueprints you give them through special means (such as FTB quests) to be printable,
#you can set nbtMode = true, canSurvivalPrint = false, and survivalPrintConsume = true in this configuration file.
#With these settings, blueprints will not be printable by default unless you set create_blueprint_tweaks:can_survival_print=true in the blueprint’s component.
nbtMode = true
#Whether blueprints can be printed directly in survival mode
canSurvivalPrint = false
#Whether blueprints will be consumed when printed in survival mode
survivalPrintConsume = true
